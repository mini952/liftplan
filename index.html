<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LiftPlan</title>
<link rel="icon" type="image/png" href="./liftplan_icon_1024.png" />
<link rel="apple-touch-icon" href="./liftplan_icon_1024.png" />
<meta name="theme-color" content="#0F172A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --paper:   #ECEEF0;   /* clinical chart paper (cool light) */
    --card:    #F7F8F9;   /* raised surfaces */
    --ink:     #1B1E24;   /* slate ink — structural frame + text */
    --ink-2:   #4A505A;   /* secondary text */
    --ink-3:   #7B828D;   /* tertiary / captions */
    --muscle:  #A83626;   /* anatomical oxblood — the heat accent */
    --steel:   #3E6B7A;   /* engineering steel — structure / links */
    --line:    #CDD2D8;   /* hairline borders */
    --line-2:  #E1E4E8;   /* faint dividers */
    --good:    #2F7D4F;
    --warn:    #B8720E;
    --bad:     #B23A32;
    --shadow:  0 1px 2px rgba(27,30,36,.06), 0 4px 16px rgba(27,30,36,.05);
    --rail-w:  248px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  h1,h2,h3 { font-family: "Space Grotesk", sans-serif; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  a { color: var(--steel); }
  button { font-family: inherit; }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: var(--rail-w) 1fr; height: 100vh; }

  /* Left rail */
  .rail {
    background: var(--ink);
    color: #D9DDE3;
    display: flex; flex-direction: column;
    padding: 22px 0 14px;
    overflow-y: auto;
  }
  .brand { padding: 0 22px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand .logo {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .brand .mark {
    width: 26px; height: 26px; flex: none;
  }
  .brand .name { font-family: "Space Grotesk"; font-weight: 700; font-size: 20px; color: #fff; letter-spacing: -.02em; }
  .brand .tag { font-size: 11px; color: #8A92A0; margin-top: 6px; letter-spacing: .02em; }

  .nav { padding: 14px 12px 4px; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: #6C7482; padding: 8px 10px 6px; }
  .nav-btn {
    width: 100%; text-align: left; border: 0; background: transparent; color: #C6CCD5;
    padding: 9px 12px; border-radius: 7px; cursor: pointer; font-size: 13.5px; font-weight: 500;
    display: flex; align-items: center; gap: 10px; letter-spacing: -.005em;
  }
  .nav-btn .count { margin-left: auto; font-size: 11px; color: #7A828F; }
  .nav-btn:hover { background: rgba(255,255,255,.05); color: #fff; }
  .nav-btn.active { background: rgba(168,54,38,.16); color: #fff; box-shadow: inset 2px 0 0 var(--muscle); }
  .nav-btn.active .count { color: #E4B4AC; }
  .nav-ico { width: 16px; height: 16px; flex: none; opacity: .9; }

  .rail-foot { margin-top: auto; padding: 12px; }
  .io-btn {
    width: 100%; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.03);
    color: #D9DDE3; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
  }
  .io-btn:hover { background: rgba(255,255,255,.08); }
  .rail-note { font-size: 10.5px; color: #6C7482; padding: 12px 4px 2px; line-height: 1.4; }

  /* Working pane */
  .pane { overflow: hidden; display: flex; flex-direction: column; }
  .banner {
    background: #FBF3D9; color: #6b4e07; border-bottom: 1px solid #EBD9A0;
    padding: 8px 24px; font-size: 12.5px; display: none; align-items: center; gap: 10px;
  }
  .banner.show { display: flex; }
  .banner .mono { color: #7a5a08; }

  .pane-head {
    padding: 20px 28px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-end; gap: 16px; flex: none; background: var(--paper);
  }
  .pane-head h1 { font-size: 24px; }
  .pane-head .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 3px; }
  .search {
    margin-left: auto; position: relative;
  }
  .search input {
    font-family: inherit; font-size: 13px; padding: 8px 12px 8px 32px; width: 240px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
  }
  .search input:focus { outline: 2px solid var(--steel); outline-offset: 0; border-color: transparent; }
  .search svg { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px; stroke: var(--ink-3); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
    padding: 4px 10px; border-radius: 20px; font-size: 11.5px; cursor: pointer;
  }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .pane-body { flex: 1; overflow: hidden; display: grid; grid-template-columns: 1fr; }
  .split { grid-template-columns: minmax(300px, 380px) 1fr; }
  .list-col { border-right: 1px solid var(--line); overflow-y: auto; background: var(--paper); }
  .detail-col { overflow-y: auto; padding: 0; background: var(--card); }

  /* List items */
  .li {
    padding: 12px 20px; border-bottom: 1px solid var(--line-2); cursor: pointer;
    display: flex; align-items: center; gap: 12px;
  }
  .li:hover { background: #E3E6E9; }
  .li.sel { background: #fff; box-shadow: inset 3px 0 0 var(--muscle); }
  .li .li-id { font-size: 10.5px; color: var(--ink-3); }
  .li .li-title { font-weight: 500; font-size: 13.5px; letter-spacing: -.005em; }
  .li .li-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .li .li-right { margin-left: auto; text-align: right; flex: none; }

  .tag {
    display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 5px; font-weight: 500;
    background: #E4E7EB; color: var(--ink-2); letter-spacing: .01em;
  }
  .tag.steel { background: rgba(62,107,122,.13); color: var(--steel); }
  .tag.muscle { background: rgba(168,54,38,.12); color: var(--muscle); }
  .tag.ghost  { background: transparent; color: var(--ink-3); border: 1px solid var(--line); }
  .tag.prop { background: rgba(168,54,38,.10); color: var(--muscle); }
  .tag.stab { background: rgba(62,107,122,.12); color: var(--steel); }

  /* Detail */
  .detail { padding: 26px 30px; max-width: 860px; }
  .detail.enter { animation: rise .22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .d-eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .d-title { font-size: 26px; margin: 4px 0 2px; }
  .d-id { color: var(--muscle); font-size: 13px; }
  .d-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .d-desc { color: var(--ink-2); font-size: 13.5px; margin: 6px 0 0; }

  .callout {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; margin: 18px 0; display: flex; align-items: center; gap: 14px;
  }
  .callout .big { font-family: "Space Grotesk"; font-size: 15px; font-weight: 600; }
  .callout .lbl { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }

  .section-h { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
    margin: 24px 0 10px; display: flex; align-items: baseline; gap: 8px; }
  .section-h .n { color: var(--ink); font-family: "IBM Plex Mono"; font-size: 12px; }

  /* Involvement table */
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid th {
    text-align: left; font-family: "Space Grotesk"; font-weight: 500; font-size: 11px;
    color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em;
    padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  table.grid td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  table.grid tr:hover td { background: var(--paper); }
  .heat { display: inline-flex; align-items: center; gap: 9px; }
  .swatch {
    width: 30px; height: 22px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono"; font-weight: 600; font-size: 12px; flex: none;
  }
  .chain { color: var(--ink-3); font-size: 11.5px; }
  .chain b { color: var(--ink-2); font-weight: 500; }
  .note-cell { color: var(--ink-2); font-size: 12px; max-width: 320px; }

  /* Structure tree */
  .tree { max-width: 820px; }
  .area-block { margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
  .area-head { padding: 12px 16px; background: var(--card); display: flex; align-items: center; gap: 10px; }
  .area-head h3 { font-size: 15px; }
  .area-head .mono { color: var(--ink-3); font-size: 11px; }
  .group-row { padding: 8px 16px 8px 30px; border-top: 1px solid var(--line-2); }
  .group-row .g-name { font-weight: 600; font-size: 12.5px; }
  .muscle-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .m-pill { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); color: var(--ink-2); }

  /* Data health */
  .health { max-width: 860px; padding: 26px 30px; }
  .check {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 9px; margin-bottom: 8px; background: var(--paper); font-size: 13px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--good); } .dot.no { background: var(--bad); } .dot.info { background: var(--steel); }
  .check .c-name { font-weight: 500; }
  .check .c-res { margin-left: auto; font-family: "IBM Plex Mono"; font-size: 12px; color: var(--ink-2); }
  .check .c-res.pass { color: var(--good); } .check .c-res.fail { color: var(--bad); }
  .histo { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin: 8px 0 4px; }
  .bar { flex: 1; background: linear-gradient(var(--steel), #6a97a4); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
  .bar span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--ink-3); font-family: "IBM Plex Mono"; }
  .bar em { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--ink-3); font-style: normal; font-family: "IBM Plex Mono"; }

  .empty { color: var(--ink-3); padding: 60px 30px; text-align: center; }
  .empty svg { width: 40px; height: 40px; stroke: var(--line); margin-bottom: 12px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 9px; font-size: 13px;
    box-shadow: var(--shadow); transition: transform .25s ease; z-index: 50;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .rail { flex-direction: row; overflow-x: auto; }
    .pane-body.split { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT RAIL -->
  <aside class="rail">
    <div class="brand">
      <span class="logo">
        <svg class="mark" viewBox="0 0 24 24" fill="none">

          <path d="M12 5.5c-2.2 0-3.4 1.6-3.4 3.2 0 1.1.6 1.9.6 3.1 0 1.4-1 2-1 3.4 0 1.4 1.3 2.3 2.6 2.3M12 5.5c2.2 0 3.4 1.6 3.4 3.2 0 1.1-.6 1.9-.6 3.1 0 1.4 1 2 1 3.4 0 1.4-1.3 2.3-2.6 2.3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        </svg>

      </span>
      <div class="tag" style="display:none"></div>

    </div>

    <nav class="nav">
      <div class="nav-label">Databases</div>
      <button class="nav-btn active" data-view="exercises">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 6.5h11M6.5 12h11M6.5 17.5h11" stroke-linecap="round"/><circle cx="3.5" cy="6.5" r="1.3"/><circle cx="3.5" cy="12" r="1.3"/><circle cx="3.5" cy="17.5" r="1.3"/></svg>
        Exercises <span class="count" id="cExercises"></span>
      </button>
      <button class="nav-btn" data-view="muscles">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c-2.5 0-4 1.8-4 3.7 0 1.3.7 2.2.7 3.6 0 1.6-1.2 2.4-1.2 4 0 1.7 1.5 2.9 3 2.9M12 3c2.5 0 4 1.8 4 3.7 0 1.3-.7 2.2-.7 3.6 0 1.6 1.2 2.4 1.2 4 0 1.7-1.5 2.9-3 2.9" stroke-linecap="round"/></svg>
        Muscles <span class="count" id="cMuscles"></span>
      </button>
      <button class="nav-btn" data-view="structure">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v4M12 8H6v3M12 8h6v3M6 11v3M18 11v3M12 8v6"/><rect x="9" y="14" width="6" height="4" rx="1"/><rect x="3" y="14" width="6" height="4" rx="1"/><rect x="15" y="14" width="6" height="4" rx="1"/></svg>
        Structure <span class="count" id="cStructure"></span>
      </button>
      <div class="nav-label" style="margin-top:6px">System</div>
      <button class="nav-btn" data-view="health">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2-6 3 12 3-9 2 3h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Data health <span class="count" id="cHealth"></span>
      </button>
    </nav>

    <div class="rail-foot">
      <input type="file" id="importFile" accept="application/json" hidden />
      <button class="io-btn" id="btnExport">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12M8 11l4 4 4-4M5 19h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export my data
      </button>
      <button class="io-btn" id="btnImport">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15V3M8 7l4-4 4 4M5 19h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Import my data
      </button>
      <div class="rail-note" id="dataSourceNote">Loading data…</div>
    </div>
  </aside>

  <!-- WORKING PANE -->
  <main class="pane">
    <div class="banner" id="banner"></div>
    <div class="pane-head">
      <div>
        <h1 id="viewTitle">Exercises</h1>
        <div class="sub" id="viewSub"></div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="search" id="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Search…" autocomplete="off" />
      </div>
    </div>
    <div class="pane-body split" id="paneBody">
      <div class="list-col" id="listCol"></div>
      <div class="detail-col" id="detailCol"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

/* ---------- tiny, quote-aware CSV parser (RFC-4180-ish) ---------- */
function parseCSV(text) {
  const rows = []; let row = [], field = "", i = 0, inQ = false;
  text = text.replace(/^\uFEFF/, "");
  while (i < text.length) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; }
      field += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === ',') { row.push(field); field = ""; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift().map(h => h.trim());
  return rows.filter(r => r.length && !(r.length === 1 && r[0] === ""))
             .map(r => Object.fromEntries(header.map((h, k) => [h, (r[k] ?? "").trim()])));
}

/* ---------- state ---------- */
const DB = {};                 // parsed tables
const IX = {};                 // indexes
let DATA_SOURCE = "live";      // "live" | "embedded"
let PERSONAL = { app: APP_NAME, schemaVersion: 1, exportedAt: null, programs: [], sessions: [], xp: { byMuscle: {} } };

let currentView = "exercises";
let selected = { exercises: null, muscles: null };
let searchQ = "";
let activeFilters = { exercises: new Set(), muscles: new Set() };

/* ---------- load ---------- */
async function loadTable(name) {
  try {
    const res = await fetch(`data/${name}.csv`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    return { rows: parseCSV(await res.text()), src: "live" };
  } catch (e) {
    if (EMBEDDED_DATA[name]) return { rows: parseCSV(atob(EMBEDDED_DATA[name])), src: "embedded" };
    throw e;
  }
}

async function boot() {
  document.title = APP_NAME;
  document.getElementById("brandName").textContent = APP_NAME;
  document.getElementById("brandTag").textContent = APP_TAGLINE;
  PERSONAL.app = APP_NAME;

  let anyEmbedded = false, ok = true;
  for (const t of TABLES) {
    try {
      const { rows, src } = await loadTable(t);
      DB[t] = rows;
      if (src === "embedded") anyEmbedded = true;
    } catch (e) { ok = false; DB[t] = []; }
  }
  DATA_SOURCE = anyEmbedded ? "embedded" : "live";
  buildIndexes();

  const note = document.getElementById("dataSourceNote");
  const banner = document.getElementById("banner");
  if (!ok) {
    note.textContent = "Couldn't load the data files.";
  } else if (DATA_SOURCE === "embedded") {
    note.innerHTML = 'Source: <span class="mono">bundled snapshot</span>';
    banner.className = "banner show";
    banner.innerHTML = '<b>Preview mode.</b>&nbsp; Showing the bundled snapshot because the <span class="mono">data/</span> CSVs couldn\'t be fetched. Deploy to GitHub Pages (or serve locally) to read your live files.';
  } else {
    note.innerHTML = 'Source: <span class="mono">live /data CSVs</span>';
  }

  // counts in the rail
  set("cExercises", DB.exercises.length);
  set("cMuscles", DB.muscles.length);
  set("cStructure", DB.general_areas.length + " areas");
  const v = validate();
  set("cHealth", (v.fails ? v.fails + " ⚠" : "OK"));
  document.getElementById("cHealth").style.color = v.fails ? "#E4B4AC" : "#7A828F";

  wireChrome();
  render();
}
function set(id, v) { document.getElementById(id).textContent = v; }

/* ---------- indexes / joins ---------- */
function buildIndexes() {
  IX.areaById   = Object.fromEntries((DB.general_areas||[]).map(a => [a.Area_ID, a]));
  IX.groupById  = Object.fromEntries((DB.muscle_groups||[]).map(g => [g.Group_ID, g]));
  IX.muscleById = Object.fromEntries((DB.muscles||[]).map(m => [m.Muscle_ID, m]));
  IX.exById     = Object.fromEntries((DB.exercises||[]).map(e => [e.Exercise_ID, e]));
  IX.emByEx = {}; IX.emByMuscle = {};
  for (const r of (DB.exercise_muscle||[])) {
    (IX.emByEx[r.Exercise_ID] = IX.emByEx[r.Exercise_ID] || []).push(r);
    (IX.emByMuscle[r.Muscle_ID] = IX.emByMuscle[r.Muscle_ID] || []).push(r);
  }
}
// resolve a fact row -> {muscle, group, area} following IDs (area is authoritative on the muscle)
function joinFact(r) {
  const m = IX.muscleById[r.Muscle_ID];
  const g = m ? IX.groupById[m.Group_ID] : null;
  const a = m ? IX.areaById[m.Area_ID] : null;
  return { m, g, a };
}
function mainMover(exId) {
  const rows = (IX.emByEx[exId] || []).filter(r => r.Muscle_Role === "Primary");
  if (!rows.length) return null;
  rows.sort((x, y) => Number(y.Intensity_Value) - Number(x.Intensity_Value));
  return joinFact(rows[0]).m;
}

/* ---------- heat scale (previews the Phase-3 heatmap identity) ---------- */
const HEAT = { 1:"#C9CED4",2:"#CFC9A6",3:"#D9C77E",4:"#E0B45C",5:"#E0A144",6:"#D98638",7:"#CE6A34",8:"#BE4C2C",9:"#A83626",10:"#8F2620" };
function heatColor(v){ v = Math.max(1, Math.min(10, Math.round(Number(v)||1))); return HEAT[v]; }
function heatText(v){ return (Number(v)||1) >= 6 ? "#fff" : "#1B1E24"; }
function swatch(v){ return `<span class="swatch" style="background:${heatColor(v)};color:${heatText(v)}">${v}</span>`; }

/* ---------- filters ---------- */
function buildFilters() {
  const filters = document.getElementById("filters");
  let defs = [];
  if (currentView === "exercises") {
    defs = [
      ["Active", e => e.Active === "True"],
      ["Compound", e => e.Category === "Compound"],
      ["Isolation", e => e.Category === "Isolation"],
      ["Analyzed", e => IX.emByEx[e.Exercise_ID]],
      ["Not yet analyzed", e => !IX.emByEx[e.Exercise_ID]],
    ];
  } else {
    defs = [
      ["Propulsion", m => m.Function === "Propulsion"],
      ["Stability", m => m.Function === "Stability"],
    ];
  }
  filters.innerHTML = "";
  defs.forEach(([label]) => {
    const c = document.createElement("button");
    c.className = "chip" + (activeFilters[currentView].has(label) ? " on" : "");
    c.textContent = label;
    c.onclick = () => {
      const s = activeFilters[currentView];
      s.has(label) ? s.delete(label) : s.add(label);
      buildFilters(); renderList();
    };
    filters.appendChild(c);
  });
  filters._defs = defs;
}
function passFilters(item) {
  const defs = document.getElementById("filters")._defs || [];
  const active = activeFilters[currentView];
  for (const [label, fn] of defs) if (active.has(label) && !fn(item)) return false;
  return true;
}

    const groups = groupIds.map(id => IX.groupById[id]).filter(Boolean)

/* ---------- data health / validation (§5.2 + shape) ---------- */
function validate() {
  const em = DB.exercise_muscle || [];
  const checks = [];
  const add = (name, ok, res, info) => checks.push({ name, ok, res, info });

  const badExFK = em.filter(r => !IX.exById[r.Exercise_ID]).length;
  const badMuFK = em.filter(r => !IX.muscleById[r.Muscle_ID]).length;
  const badGrpFK = (DB.muscles||[]).filter(m => !IX.groupById[m.Group_ID]).length;
  const badAreaFK = (DB.muscles||[]).filter(m => !IX.areaById[m.Area_ID]).length;
  const badInt = em.filter(r => { const n=Number(r.Intensity_Value); return !Number.isInteger(n) || n<1 || n>10; }).length;
  const badRole = em.filter(r => !ROLE_SET.includes(r.Muscle_Role)).length;
  const badContr = em.filter(r => !CONTRACTION_SET.includes(r.Contraction_Type)).length;
  const badSrc = em.filter(r => !SOURCE_SET.includes(r.Intensity_Source)).length;
  const seen = new Set(); let dups = 0;
  em.forEach(r => { const k = r.Exercise_ID+"|"+r.Muscle_ID; if (seen.has(k)) dups++; seen.add(k); });

  add("Exercise_ID foreign keys resolve", badExFK===0, badExFK===0?"pass":badExFK+" broken");
  add("Muscle_ID foreign keys resolve", badMuFK===0, badMuFK===0?"pass":badMuFK+" broken");
  add("Muscle → Group_ID resolves", badGrpFK===0, badGrpFK===0?"pass":badGrpFK+" broken");
  add("Muscle → Area_ID resolves", badAreaFK===0, badAreaFK===0?"pass":badAreaFK+" broken");
  add("Intensity_Value is an integer 1–10", badInt===0, badInt===0?"pass":badInt+" bad");
  add("Muscle_Role in allowed set", badRole===0, badRole===0?"pass":badRole+" bad");
  add("Contraction_Type in allowed set", badContr===0, badContr===0?"pass":badContr+" bad");
  add("Intensity_Source in allowed set", badSrc===0, badSrc===0?"pass":badSrc+" bad");
  add("No duplicate (Exercise, Muscle) pairs", dups===0, dups===0?"pass":dups+" dups");

  const fails = checks.filter(c => !c.ok).length;
  return { checks, fails, em };
}
function healthHTML() {
  const { checks, em } = validate();
  const analyzed = Object.keys(IX.emByEx).length, total = DB.exercises.length;
  // intensity histogram
  const hist = Array(10).fill(0);
  em.forEach(r => { const n=Number(r.Intensity_Value); if (n>=1&&n<=10) hist[n-1]++; });
  const maxH = Math.max(1, ...hist);
  const lowShare = em.length ? Math.round(100 * (hist[0]+hist[1]+hist[2]) / em.length) : 0;
  const avgPerAnalyzed = analyzed ? (em.length / analyzed).toFixed(1) : 0;
  // muscles never referenced
  const referenced = new Set(em.map(r => r.Muscle_ID));
  const never = (DB.muscles||[]).filter(m => !referenced.has(m.Muscle_ID));

  return `<div class="health">
    <div class="section-h" style="margin-top:0">Integrity checks <span class="n">§5.2</span></div>
    ${checks.map(c => `<div class="check">
      <span class="dot ${c.ok?'ok':'no'}"></span><span class="c-name">${c.name}</span>
      <span class="c-res ${c.ok?'pass':'fail'}">${c.res}</span></div>`).join("")}

    <div class="section-h">Coverage &amp; shape</div>
    <div class="callout">
      <div><div class="lbl">Exercises analyzed</div><div class="big">${analyzed} / ${total}</div></div>
      <div><div class="lbl">Fact rows</div><div class="big">${em.length}</div></div>
      <div><div class="lbl">Avg muscles / analyzed ex.</div><div class="big">${avgPerAnalyzed}</div></div>
      <div><div class="lbl">Rows at intensity ≤3</div><div class="big">${lowShare}%</div></div>
    </div>

    <div class="section-h">Intensity distribution</div>
    <div class="histo">${hist.map((h,i)=>`<div class="bar" style="height:${Math.max(2,Math.round(100*h/maxH))}%"><span>${h||""}</span><em>${i+1}</em></div>`).join("")}</div>
    <p style="color:var(--ink-2);font-size:12.5px;margin-top:26px">
      Every analyzed exercise currently scores the same <b>50 of 55</b> muscles, and <b>${lowShare}%</b> of rows sit at intensity ≤3 — so the raw table is dense, not sparse. That's consistent with the "keep everything, filter at display" rule (R6/D-09): the heatmap threshold does the hiding. The Phase&nbsp;8 re-analysis is where these get pruned and differentiated.
    </p>
    ${never.length?`<p style="color:var(--ink-2);font-size:12.5px;margin-top:6px">
      <b>${never.length} muscles</b> are never referenced yet: ${never.map(m=>esc(m.Specific_Muscle)).join(", ")}. They'll stay blank on the heatmap until an exercise scores them.</p>`:""}
  </div>`;
}

/* ---------- export / import (Phase 1 stub) ---------- */
function exportData() {
  PERSONAL.exportedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(PERSONAL, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${APP_NAME.toLowerCase()}-data-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported your data (empty for now — plans arrive in Phase 2).");
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (typeof obj !== "object" || !("programs" in obj) || !("sessions" in obj))
        throw new Error("Not a LiftPlan data file (missing programs/sessions).");
      PERSONAL = Object.assign({ app: APP_NAME, schemaVersion: 1, programs: [], sessions: [], xp: { byMuscle: {} } }, obj);
      toast(`Imported: ${PERSONAL.programs.length} program(s), ${PERSONAL.sessions.length} session(s).`);
    } catch (err) { toast("Import failed: " + err.message); }
    e.target.value = "";
  };
  reader.readAsText(file);
}

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200); }

boot();
</script>
